services:
  kies-drive:
    image: ghcr.io/tim-stubbe/kies-drive:latest
    container_name: kies-drive
    restart: unless-stopped
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      KIES_BASE_URL: ${KIES_BASE_URL:-https://100.72.226.91:8000}
      # Optional legacy bridge for fuel/speed/Jarvis until those providers are
      # moved too. Account login and the direct SearXNG toll search need no token.
      KIES_DEVICE_TOKEN: ${KIES_DEVICE_TOKEN:-}
      KIES_VERIFY_TLS: ${KIES_VERIFY_TLS:-true}
      # Uses the private sidecar by default. An existing TrueNAS SearXNG can
      # still be selected by setting SEARXNG_URL explicitly.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      KIES_DRIVE_PUBLIC_URL: ${KIES_DRIVE_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
    volumes:
      - ./data:/data
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: kies-drive-searxng
    restart: unless-stopped
    # No host port: toll research is available only to Kies Drive on the
    # private Compose network and cannot become an unauthenticated search API.
    expose:
      - "8080"
    volumes:
      - ./Server/searxng/settings.yml:/etc/searxng/settings.yml:ro
