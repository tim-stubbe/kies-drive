services:
  kies-drive:
    image: ghcr.io/tim-stubbe/kies-drive:latest
    container_name: kies-drive
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      KIES_BASE_URL: ${KIES_BASE_URL:-https://100.72.226.91:8000}
      KIES_DEVICE_TOKEN: ${KIES_DEVICE_TOKEN:?set KIES_DEVICE_TOKEN}
      KIES_DRIVE_PUBLIC_URL: ${KIES_DRIVE_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # Temporary bridge until the MCP tunnel supports browser-based OAuth.
      # This is an account session created by /auth/login, never a device token.
      KIES_DRIVE_MCP_AUTHORIZATION: ${KIES_DRIVE_MCP_AUTHORIZATION:-}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
    volumes:
      - ./data:/data
