name: KiesDrive
options:
  bundleIdPrefix: app.kies.drive
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  KiesDriveCorePackage:
    path: .
targets:
  KiesDriveiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/KiesDrive
        excludes: [Info-macOS.plist, Info-iOS.plist]
    dependencies:
      - package: KiesDriveCorePackage
        product: KiesDriveCore
    settings:
      base:
        PRODUCT_NAME: Kies Drive
        PRODUCT_BUNDLE_IDENTIFIER: app.kies.drive.ios.dev
        INFOPLIST_FILE: Sources/KiesDrive/Info-iOS-PersonalTeam.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NGBW8LC6RA
  KiesDriveMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/KiesDrive
        excludes: [Info-iOS.plist, Info-iOS-PersonalTeam.plist]
    dependencies:
      - package: KiesDriveCorePackage
        product: KiesDriveCore
    settings:
      base:
        PRODUCT_NAME: Kies Drive
        PRODUCT_BUNDLE_IDENTIFIER: app.kies.drive.macos
        INFOPLIST_FILE: Sources/KiesDrive/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
  KiesDriveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KiesDriveTests
    dependencies:
      - target: KiesDriveMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kies Drive.app/Contents/MacOS/Kies Drive"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KiesDriveiOS:
    build:
      targets:
        KiesDriveiOS: all
  KiesDriveMac:
    build:
      targets:
        KiesDriveMac: all
    test:
      targets: [KiesDriveTests]
